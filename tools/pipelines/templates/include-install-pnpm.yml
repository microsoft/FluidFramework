# include-install-pnpm
#
# This template can be included in pipelines to install pnpm with store caching enabled.

parameters:
# The path containing the project(s) to build.
- name: buildDirectory
  type: string

# If set to false, the pnpm store will not be cached or restored from cache.
- name: enableCache
  type: boolean
  default: true

# The path to the pnpm store. The contents here will be cached and restored when using pnpm in a pipeline.
- name: pnpmStorePath
  type: string
  default: $(Pipeline.Workspace)/.pnpm-store

# Where to place the user-level .npmrc file. Pnpm will be configured to reference this file for the duration of the job.
# Rather than rely on the default $HOME/.npmrc, we specify a known-reasonable location here.
# Users of the template probably don't need to change this.
- name: userNpmrcPath
  type: string
  default: $(Agent.TempDirectory)/.npmrc

steps:
- ${{ if eq(parameters.enableCache, true) }}:
  - task: Cache@2
    displayName: Cache pnpm store
    timeoutInMinutes: 3
    continueOnError: true
    inputs:
      # Caches are already scoped to individual pipelines, so no need to include the release group name or tag
      # in the cache key
      key: 'pnpm-store | "$(Agent.OS)" | ${{ parameters.buildDirectory }}/pnpm-lock.yaml'
      path: ${{ parameters.pnpmStorePath }}
      restoreKeys: |
        pnpm-store | "$(Agent.OS)"

# Point npm at the authenticated feed before installing pnpm, so that `npm install -g pnpm@<version>` can
# fetch pnpm itself from that feed.
- template: /tools/pipelines/templates/include-configure-npm-registry.yml@self
  parameters:
    buildDirectory: ${{ parameters.buildDirectory }}
    userNpmrcPath: ${{ parameters.userNpmrcPath }}

- task: Bash@3
  displayName: Install pnpm
  env:
    NPM_CONFIG_USERCONFIG: $(NPM_CONFIG_USERCONFIG)
    NPM_REGISTRY: $(ado-feeds-primary-registry)
    SOURCES_DIR: $(Build.SourcesDirectory)
  inputs:
    targetType: 'inline'
    workingDirectory: ${{ parameters.buildDirectory }}
    # workspace-concurrency 0 means use use the CPU core count. This is better than the default (4) for larger agents.
    script: |
      set -eu -o pipefail
      normalize_registry() {
        local registry="$1"
        while [ "${registry%/}" != "$registry" ]; do
          registry="${registry%/}"
        done
        printf '%s/' "$registry"
      }

      expected_registry="$(normalize_registry "$NPM_REGISTRY")"
      npm_registry="$(normalize_registry "$(npm config get registry)")"
      if [ "$npm_registry" != "$expected_registry" ]; then
        echo "##vso[task.logissue type=error]npm resolved registry '$npm_registry'; expected '$expected_registry'"
        exit 1
      fi
      echo "npm registry: $npm_registry"

      # Resolve the pnpm version from the "packageManager" field (e.g. "pnpm@9.15.7+sha512..." -> "pnpm@9.15.7").
      # The integrity hash suffix is discarded, since npm provides no practical way to use it; we trust the
      # feed to serve the correct version. Not every caller passes a buildDirectory that contains a
      # package.json (some point at an artifact directory), so fall back to the repo root.
      PNPM_VERSION=$(node -e '
        const fs = require("fs");
        const path = require("path");
        for (const dir of [process.cwd(), process.env.SOURCES_DIR]) {
          const file = path.join(dir, "package.json");
          if (!fs.existsSync(file)) continue;
          const packageManager = JSON.parse(fs.readFileSync(file, "utf8")).packageManager;
          if (packageManager) {
            console.log(packageManager.split("+")[0]);
            process.exit(0);
          }
        }
        console.error("Could not resolve a packageManager field to install pnpm from.");
        process.exit(1);
      ')
      echo "Installing ${PNPM_VERSION}"
      npm install -g "$PNPM_VERSION" --userconfig "${{ parameters.userNpmrcPath }}"
      echo "Using pnpm $(pnpm -v)"
      pnpm_registry="$(normalize_registry "$(pnpm config get registry)")"
      if [ "$pnpm_registry" != "$expected_registry" ]; then
        echo "##vso[task.logissue type=error]pnpm resolved registry '$pnpm_registry'; expected '$expected_registry'"
        exit 1
      fi
      echo "pnpm registry: $pnpm_registry"
      echo "Pnpm user config location: $(pnpm config get userconfig)"
      pnpm config set store-dir ${{ parameters.pnpmStorePath }}
      echo "Pnpm store: ${{ parameters.pnpmStorePath }}"
      pnpm config set -g workspace-concurrency 0
