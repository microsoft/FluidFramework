steps:
- task: Bash@3
  displayName: Use native tsc CLI with the TypeScript 6 build API
  env:
    NATIVE_TSC_DIRECTORY: $(Agent.TempDirectory)/native-test-typescript
  inputs:
    targetType: inline
    workingDirectory: $(Pipeline.Workspace)/$(FluidFrameworkDirectory)
    script: |
      set -eu -o pipefail
      node --input-type=module <<'JS'
      import fs from "node:fs";
      import path from "node:path";
      const directory = process.env.NATIVE_TSC_DIRECTORY;
      fs.mkdirSync(directory, { recursive: true });
      fs.writeFileSync(path.join(directory, "package.json"),
        JSON.stringify({ private: true, dependencies: { typescript: "7.0.2" } }) + "\n");
      JS
      npm install --prefix "$NATIVE_TSC_DIRECTORY" --ignore-scripts --no-audit --no-fund
      node --input-type=module <<'JS'
      import { execFileSync } from "node:child_process";
      import { createHash } from "node:crypto";
      import fs from "node:fs";
      import { createRequire } from "node:module";
      import path from "node:path";
      import ts from "typescript";
      const require = createRequire(import.meta.url);
      const originalCli = require.resolve("typescript/bin/tsc");
      const hash = (file) => createHash("sha256").update(fs.readFileSync(file)).digest("hex");
      const originalHash = hash(originalCli);
      const nativeCli = path.join(process.env.NATIVE_TSC_DIRECTORY, "node_modules/typescript/bin/tsc");
      const nativeVersion = execFileSync(process.execPath, [nativeCli, "--version"], { encoding: "utf8" }).trim();
      if (nativeVersion !== "Version 7.0.2" || !ts.version.startsWith("6.")) {
        throw new Error(`Unexpected compiler pair: native ${nativeVersion}, API ${ts.version}`);
      }
      const wrapper = [
        "#!/usr/bin/env node",
        'const { spawnSync } = require("node:child_process");',
        `const result = spawnSync(${JSON.stringify(process.execPath)}, [${JSON.stringify(nativeCli)}, ...process.argv.slice(2)], { stdio: "inherit" });`,
        "if (result.error) throw result.error;",
        'if (result.status === null) throw new Error(`Native compiler terminated by ${result.signal}`);',
        "process.exit(result.status);",
        "",
      ].join("\n");
      const root = fs.realpathSync(process.cwd());
      const packages = JSON.parse(execFileSync("pnpm", ["list", "-r", "--depth", "-1", "--json"], { encoding: "utf8" }));
      let replaced = 0;
      for (const pkg of packages) {
        const bin = path.join(pkg.path, "node_modules/.bin/tsc");
        if (pkg.name === "@fluid-experimental/property-properties") {
          const version = execFileSync(bin, ["--version"], { encoding: "utf8" }).trim();
          if (!version.startsWith("Version 6.")) {
            throw new Error(`Expected the legacy declaration compiler for ${pkg.name}, got ${version}`);
          }
          console.log(`Retaining ${version} for ${pkg.name}: native JS declaration emit fails with TS2883`);
          continue;
        }
        if (!fs.existsSync(bin)) continue;
        const directory = fs.realpathSync(path.dirname(bin));
        if (!directory.startsWith(root + path.sep)) {
          throw new Error(`Refusing to change a compiler bin outside this checkout: ${directory}`);
        }
        // Replace the local bin entry, never the compiler package or a shared store inode.
        const temporary = path.join(directory, `.tsc-native-ci-${process.pid}`);
        fs.writeFileSync(temporary, wrapper, { flag: "wx", mode: 0o755 });
        fs.renameSync(temporary, bin);
        replaced++;
      }
      if (replaced === 0 || hash(originalCli) !== originalHash) {
        throw new Error("Native CLI setup failed or changed the original TypeScript compiler");
      }
      console.log(`Native ${nativeVersion}: replaced ${replaced} local tsc bins; retained API ${ts.version}`);
      console.log("Direct compatibility compiler remains:",
        execFileSync(process.execPath, [originalCli, "--version"], { encoding: "utf8" }).trim());
      JS
