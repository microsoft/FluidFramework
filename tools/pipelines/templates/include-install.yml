# Shared dependency installation for pnpm-based pipelines.

parameters:
# Directory relative to $(Pipeline.Workspace), e.g. s/FluidFramework/build-tools.
# This template prepends $(Pipeline.Workspace)/; do not supply an absolute path.
- name: buildDirectory
  type: string

- name: installDependenciesDescription
  type: string
  default: Install dependencies

- name: installPnpm
  type: boolean
  default: true

- name: installWorkspaceRootOnly
  type: boolean
  default: false

- name: primaryRegistry
  type: string
  default: $(ado-feeds-primary-registry)

- name: userNpmrcPath
  type: string
  default: $(Agent.TempDirectory)/.npmrc

# string with ` | ` separated list of lockfiles (note that the spacing is meaningful)
- name: additionalLockFilePaths
  type: string
  default: ''

steps:
  - ${{ if parameters.installPnpm }}:
    - template: /tools/pipelines/templates/include-install-pnpm.yml@self
      parameters:
        buildDirectory: ${{ parameters.buildDirectory }}
        primaryRegistry: ${{ parameters.primaryRegistry }}
        userNpmrcPath: ${{ parameters.userNpmrcPath }}
        ${{ if ne(parameters.additionalLockFilePaths, '') }}:
          additionalOptionalCacheKey: '$(Pipeline.Workspace)/${{ replace(parameters.additionalLockFilePaths, '' | '', '' | $(Pipeline.Workspace)/'') }}'
          requiredCacheKey: '"${{ replace(parameters.additionalLockFilePaths, '' | '', ''" | "'') }}"'

  - task: Bash@3
    displayName: '${{ parameters.installDependenciesDescription }} (${{ parameters.buildDirectory }})'
    retryCountOnTaskFailure: 4
    inputs:
      # Keep this inline: template expansion does not check out FluidFramework on the agent.
      # Some callers check out only ff_pipeline_host; a script file would require another checkout.
      targetType: 'inline'
      workingDirectory: '$(Pipeline.Workspace)/${{ parameters.buildDirectory }}'
      script: |
        set -eu -o pipefail
        pwd
        args=(--frozen-lockfile)
        if [ '${{ parameters.installWorkspaceRootOnly }}' = 'True' ]; then
          args+=(--workspace-root)
        fi
        pnpm install "${args[@]}"
