# build-client-windows pipeline to validate Windows compatibility (build, lint, and repo checks)

name: $(Build.BuildId)

trigger:
  branches:
    include:
    - main
    - next
    - lts
    - release/*
  paths:
    include:
    - .dockerignore
    - .gitattributes
    - .gitignore
    - .gitmodules
    - .git-blame-ignore-revs
    - .markdownlint.json
    - .npmrc
    - .nvmrc
    - .pnpmfile.cjs
    - .prettierignore
    - .releaseGroup
    - _buildProject.config.cjs
    - assertTagging.config.mjs
    - azure
    - biome.json
    - biome.jsonc
    - BREAKING.md
    - common/build/build-common
    - common/build/eslint-config-fluid
    - ClientRequirements.md
    - CODE_OF_CONDUCT.md
    - CONTRIBUTING.md
    - CredScanSuppressions.json
    - examples
    - experimental
    - fluidBuild.config.cjs
    - layerInfo.json
    - LICENSE
    - NOTICE.md
    - packages
    - PACKAGES.md
    - package.json
    - patches/*
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - prettier.config.cjs
    - README.md
    - scripts/*
    - SECURITY.md
    - .syncpackrc.yml
    - tools/markdown-magic/*
    - tools/pipelines/build-client-windows.yml
    - tools/pipelines/templates/include-build-lint.yml
    - tools/pipelines/templates/include-policy-check.yml
    - tools/pipelines/templates/include-install-pnpm.yml
    - tools/pipelines/templates/include-use-node-version.yml

pr:
  branches:
    include:
    - main
    - next
    - lts
    - release/*
  paths:
    include:
    - .dockerignore
    - .gitattributes
    - .gitignore
    - .gitmodules
    - .git-blame-ignore-revs
    - .markdownlint.json
    - .npmrc
    - .nvmrc
    - .pnpmfile.cjs
    - .prettierignore
    - .releaseGroup
    - _buildProject.config.cjs
    - assertTagging.config.mjs
    - azure
    - biome.json
    - biome.jsonc
    - BREAKING.md
    - common/build/build-common
    - common/build/eslint-config-fluid
    - ClientRequirements.md
    - CODE_OF_CONDUCT.md
    - CONTRIBUTING.md
    - CredScanSuppressions.json
    - examples
    - experimental
    - fluidBuild.config.cjs
    - layerInfo.json
    - LICENSE
    - NOTICE.md
    - packages
    - PACKAGES.md
    - package.json
    - patches/*
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - prettier.config.cjs
    - README.md
    - scripts/*
    - SECURITY.md
    - .syncpackrc.yml
    - tools/markdown-magic/*
    - tools/pipelines/build-client-windows.yml
    - tools/pipelines/templates/include-build-lint.yml
    - tools/pipelines/templates/include-policy-check.yml
    - tools/pipelines/templates/include-install-pnpm.yml
    - tools/pipelines/templates/include-use-node-version.yml

variables:
- name: pnpmStorePath
  value: $(Pipeline.Workspace)/.pnpm-store
- group: ado-feeds
- name: consistentSourcesDirectory
  value: 's'
- name: FluidFrameworkDirectory
  value: '${{ variables.consistentSourcesDirectory }}/FluidFramework'
- name: FFPipelineHostDirectory
  value: '${{ variables.consistentSourcesDirectory }}/ff_pipeline_host'
# Suppress "data is over two months old" warnings from baseline-browser-mapping
- name: BASELINE_BROWSER_MAPPING_IGNORE_OLD_DATA
  value: 1

resources:
  repositories:
  - repository: m365Pipelines
    type: git
    name: 1ESPipelineTemplates/M365GPT
    ref: refs/tags/release
extends:
  ${{ if eq(variables['System.TeamProject'], 'internal') }}:
    template: v1/M365.Official.PipelineTemplate.yml@m365Pipelines
  ${{ else }}:
    template: v1/M365.Unofficial.PipelineTemplate.yml@m365Pipelines
  parameters:
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: windows-2022
      os: windows
    sdl:
      ${{ if eq(variables['System.TeamProject'], 'internal') }}:
        arrow:
          serviceConnection: ff-internal-arrow-sc
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared
        image: windows-2022
        os: windows
      credscan:
        batchSize: 4
    settings:
      skipBuildTagsForGitHubPullRequests: true
    customBuildTags:
      - ES365AIMigrationTooling
    stages:
    - stage: windows_build_and_validate
      displayName: Windows Build & Validate
      jobs:
      - job: validate_windows
        displayName: Build, Lint & Checks
        timeoutInMinutes: 120
        steps:
        - task: Bash@3
          displayName: Variables
          inputs:
            targetType: 'inline'
            workingDirectory: $(Pipeline.Workspace)
            script: |
              set -eu -o pipefail
              echo "
                Variables:
                  consistentSourcesDirectory=${{ variables.consistentSourcesDirectory }}
                  FluidFrameworkDirectory=${{ variables.FluidFrameworkDirectory }}
                  FFPipelineHostDirectory=${{ variables.FFPipelineHostDirectory }}
                  Agent.OS=$(Agent.OS)
              "

        - checkout: self
          path: ${{ variables.FluidFrameworkDirectory }}
          clean: true
          fetchDepth: 1
          fetchTags: false

        - template: /tools/pipelines/templates/include-use-node-version.yml@self

        - template: /tools/pipelines/templates/include-install-pnpm.yml@self
          parameters:
            buildDirectory: ${{ variables.FluidFrameworkDirectory }}

        - task: Bash@3
          displayName: Install dependencies
          retryCountOnTaskFailure: 4
          inputs:
            targetType: 'inline'
            workingDirectory: $(Pipeline.Workspace)/${{ variables.FluidFrameworkDirectory }}
            script: |
              set -eu -o pipefail
              pnpm install --frozen-lockfile

        - task: Npm@1
          displayName: Policy Check
          inputs:
            command: 'custom'
            workingDir: $(Pipeline.Workspace)/${{ variables.FluidFrameworkDirectory }}
            customCommand: 'run policy-check'

        - task: Npm@1
          displayName: Layer Check
          inputs:
            command: 'custom'
            workingDir: $(Pipeline.Workspace)/${{ variables.FluidFrameworkDirectory }}
            customCommand: 'run layer-check'

        - task: Npm@1
          displayName: Format Check (repo)
          inputs:
            command: 'custom'
            workingDir: $(Pipeline.Workspace)/${{ variables.FluidFrameworkDirectory }}
            customCommand: 'run check:format:repo'

        - task: Npm@1
          displayName: Checks (syncpack, assertTags, etc.)
          inputs:
            command: 'custom'
            workingDir: $(Pipeline.Workspace)/${{ variables.FluidFrameworkDirectory }}
            customCommand: 'run checks'

        - task: Bash@3
          displayName: Build and Lint (ci:build)
          env:
            BASELINE_BROWSER_MAPPING_IGNORE_OLD_DATA: 1
          inputs:
            targetType: 'inline'
            workingDirectory: $(Pipeline.Workspace)/${{ variables.FluidFrameworkDirectory }}
            script: |
              set -eu -o pipefail
              npm run ci:build

        - task: Bash@3
          displayName: Check for extraneous modified files
          inputs:
            targetType: 'inline'
            workingDirectory: $(Pipeline.Workspace)/${{ variables.FluidFrameworkDirectory }}
            script: |
              git status | grep -v -E 'package.json|package-lock.json|packageVersion.ts|.npmrc|build-tools/.npmrc|\(use.*' | grep '^\s' > git_status.log || true
              if [ -s git_status.log ]; then
                cat git_status.log
                echo "##vso[task.logissue type=error]Build should not create extraneous files"
                exit 1
              fi

        - task: Bash@3
          displayName: Prune pnpm store
          inputs:
            targetType: 'inline'
            workingDirectory: $(Pipeline.Workspace)/${{ variables.FluidFrameworkDirectory }}
            script: |
              set -eu -o pipefail
              pnpm store prune
