apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: fluid-secrets
spec:
  provider: azure
  parameters:
    # Microsoft Entra Workload ID, not the CSI add-on's own auto-created identity or the AKS
    # kubelet identity: every pod that mounts this class presents a federated token for the one
    # workload identity (azure/deploy.sh phase8_workload_identity). usePodIdentity/
    # useVMManagedIdentity must both be "false" -- useVMManagedIdentity "true" would instead
    # authenticate as the node's kubelet identity, which has no Key Vault role granted to it.
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: <WORKLOAD_IDENTITY_CLIENT_ID>            # from Phase 8 (workload identity)
    keyvaultName: <KV>                                  # from Phase 8
    tenantId: <AZURE_TENANT_ID>
    objects: |
      array:
        - |
          objectName: cosmos-connection-string
          objectType: secret
        - |
          objectName: redis-password
          objectType: secret
        - |
          objectName: eventhub-connection-string
          objectType: secret
