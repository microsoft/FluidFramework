name: "Pull Request Labeler"
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main, next, release/**/*]

permissions:
  contents: read # for actions/labeler to determine modified files

jobs:
  areas_label:
    permissions:
      pull-requests: write # for actions/labeler to add labels to PRs
    runs-on: ubuntu-latest
    name: Label areas
    # Skip labeling main-next merge PRs. The area labels are noisy and distracting for main-next PRs because they can
    # contain many commits, and thus touch nearly the whole repo in a single commit. Skipping these labels makes it
    # easier to focus on the more relevant main-next labels.
    #
    # This is implemented by comparing the PR title because at creation time, the PR has no labels (and the GItHub API
    # does not have a way to set labels at creation either), so skipping based on labels does not work.
    steps:
      # release notes: https://github.com/actions/labeler/releases/tag/v6.0.1
      - uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b # ratchet:actions/labeler@v6
        if: "github.event.pull_request.title != 'Automation: main-next integrate'"
        with:
          configuration-path: ".github/labeler-areas.yml"
          repo-token: "${{ github.token }}"
          sync-labels: true # add/remove labels as modified paths in the PR change
  # Changes to some paths should automatically add the changeset-required label. This label is often added manually, so
  # this CI job calls the labeler action wuth sync-labels=false, so the label won't be removed automatically.
  changesets_label:
    permissions:
      pull-requests: write # for actions/labeler to add labels to PRs
    runs-on: ubuntu-latest
    name: Label changeset-required
    steps:
      # release notes: https://github.com/actions/labeler/releases/tag/v6.0.1
      - uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b # ratchet:actions/labeler@v6
        with:
          configuration-path: ".github/labeler-changesets.yml"
          repo-token: "${{ github.token }}"
          sync-labels: false # The changeset-required label is often added manually, so don't remove it.
  branches_label:
    permissions:
      pull-requests: write # for actions/labeler to add labels to PRs
    runs-on: ubuntu-latest
    name: Label base branches and external contributors
    steps:
      # release notes: https://github.com/actions/github-script/releases/tag/v9.0.0
      # Replaces the Docker-based srvaroa/labeler action (which required Docker Hub access) with an equivalent
      # JavaScript implementation. Rules mirror .github/labeler.yml.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9
        with:
          script: |
            const baseBranch = context.payload.pull_request.base.ref;
            const prNumber = context.payload.pull_request.number;

            // Label rules mirroring .github/labeler.yml
            const labelRules = [
              { label: "base: main", pattern: /^main$/ },
              { label: "base: next", pattern: /^next$/ },
              { label: "base: release", pattern: /^release\/.*/ },
            ];

            const allManagedLabels = labelRules.map((r) => r.label);
            const labelsToAdd = labelRules.filter((r) => r.pattern.test(baseBranch)).map((r) => r.label);

            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const currentLabelNames = currentLabels.map((l) => l.name);

            // Add matching labels not yet present
            for (const label of labelsToAdd) {
              if (!currentLabelNames.includes(label)) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  labels: [label],
                });
              }
            }

            // Remove managed labels that no longer match (sync behavior)
            for (const label of allManagedLabels) {
              if (!labelsToAdd.includes(label) && currentLabelNames.includes(label)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  name: label,
                });
              }
            }
