[package]
name = "sea-benchmarks"
default-run = "sea-benchmarks"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures-util.workspace = true
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
sea-compression = { path = "../sea-compression" }
sea-core = { path = "../sea-core" }
sea-encryption = { path = "../sea-encryption" }
sea-file = { path = "../sea-file" }
sea-memory = { path = "../sea-memory" }
sea-sequencer = { path = "../sea-sequencer" }
sea-webtransport = { path = "../sea-webtransport", features = ["websocket-stream"] }
tokio.workspace = true
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["handshake", "connect"] }
wtransport = "=0.7.2"

[lints]
workspace = true
