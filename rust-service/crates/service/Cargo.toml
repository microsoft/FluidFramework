[package]
name = "fluid-native-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bytes.workspace = true
fluid-sequencer = { path = "../fluid-sequencer" }
fluid-service-storage = { path = "../storage" }
fluid-service-protocol = { path = "../protocol" }
futures-util.workspace = true
snapshotted-stream-core = { path = "../core" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.47.1", features = ["macros", "sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio.workspace = true

[lints]
workspace = true