[workspace]
members = [
    "crates/sea-benchmarks",
    "crates/sea-client",
    "crates/sea-conformance",
    "crates/sea-content-addressed",
    "crates/sea-core",
    "crates/sea-file",
    "crates/sea-sequencer",
    "crates/sea-memory",
    "crates/sea-protocol",
    "crates/sea-service",
    "crates/sea-storage",
    "crates/sea-file-durable",
    "crates/sea-compression",
    "crates/sea-encryption",
    "crates/sea-network",
    "crates/sea-service-browser",
    "crates/sea-stateful-compression",
    "crates/sea-webtransport-browser",
    "crates/sea-webtransport",
    "examples/sea-counter",
    "examples/fluid-native-service-example",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.98.1"

[workspace.dependencies]
async-trait = "0.1.89"
bytes = "1.10.1"
futures-core = "0.3.31"
futures-util = "0.3.31"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
